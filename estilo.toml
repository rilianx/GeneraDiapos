# Reglas de estilo para las diapositivas.
#
# [guia]    Texto libre, no se verifica automáticamente. `texto` lo reciben el guion
#           y cada diapo; `guion`, solo el guion (estructura y reparto del contenido);
#           `notas`, solo las notas del expositor (--notas).
# [limites] Reglas medibles. Se verifican en código sobre cada frame; si alguna
#           falla, la diapo vuelve a refinarse. Si tras los intentos sigue
#           fallando pero compila, se conserva y queda como aviso en el informe.

[guia]
texto = '''
- Una idea por diapositiva. El título la afirma como frase breve
  ("lsmear reduce el tiempo a la mitad"), no como rótulo ("Resultados").
- Viñetas cortas, en paralelo gramatical, sin párrafos. No abuses de ellas:
  alterna con dos columnas, bloques (block, alertblock, exampleblock),
  ecuaciones en display y tablas.
- Usa alertblock para limitaciones o mensajes clave, block para definiciones y
  exampleblock para ideas o ejemplos.
- \alert{} para el único concepto clave de la diapositiva, no como adorno.
- Ecuaciones: solo las esenciales, cada una acompañada de una línea que diga
  qué significa.
- Tablas: solo las filas y columnas que sostienen el mensaje; resalta el mejor
  valor con \alert{}.
- Nombres de algoritmos, software y variantes en \texttt{}.
- Español neutro; conserva en inglés solo los términos técnicos sin traducción
  establecida.
'''

# Solo para el guion: cómo repartir el contenido entre diapositivas.
guion = '''
- Un recorrido típico (adáptalo al paper y a las secciones que elijas): contexto,
  problema y limitación de lo existente; enfoques cercanos y en qué se diferencian;
  la idea, las fórmulas que la definen, el algoritmo (pseudocódigo si el paper lo
  trae) y sus variantes; configuración experimental, resultado principal contra las
  referencias, luego variantes y análisis adicionales; aportes y trabajo futuro.
- Los detalles de implementación (casos borde, fallbacks) van como una línea
  dentro de la diapositiva del algoritmo, no en una diapositiva propia.
'''

# Solo para las notas del expositor (--notas): lo que dice quien presenta.
notas = '''
- Unas 80 a 130 palabras por diapositiva (alrededor de un minuto hablando); si las
  instrucciones dan la duración de la charla, reparte el tiempo según el peso de cada
  diapositiva.
- Tono oral y directo, en primera persona del plural ("vemos", "proponemos").
- Termina con una frase que lleve a la diapositiva siguiente cuando haya continuidad.
- En tablas y figuras, di qué mirar primero (la fila o el valor que sostiene el mensaje).
'''

[limites]
max_items = 6                       # \item por diapositiva
max_palabras_item = 18              # las fórmulas cuentan como una palabra
max_anidamiento = 2                 # niveles de itemize/enumerate
max_caracteres_titulo = 60
max_alerts = 2
max_negritas = 3
sin_punto_final = false             # true: prohibe punto final en viñetas
prohibir_colores_directos = true    # \color, \textcolor: usa \alert o macros de la base
prohibir_vspace_negativo = true
# \footnotesize, \scriptsize y \tiny solo se permiten dentro de tablas y algoritmos
tamanos_permitidos = ['\small']
# Guion: fracción máxima de diapositivas que son solo viñetas (el resto: columns,
# block, equation, table, algorithm). Se aplica con 4 o más diapos de contenido.
max_fraccion_vinetas = 0.4
max_bloques = 2                     # block/alertblock/exampleblock por diapositiva
prohibir_alert_en_alertblock = true

[estructura]
# Secciones de la presentación. Vacío: las decide el guion según el paper (y las
# instrucciones, si las das). Una lista las fija, en ese orden, p. ej.:
#   secciones = ["Introducción", "Trabajo relacionado", "Propuesta", "Experimentos", "Conclusiones"]
# Al ensamblar se inserta \section{...} (aparecen en la agenda y en el tema).
secciones = []
agenda = true                       # diapo "Contenido" con \tableofcontents tras la portada
