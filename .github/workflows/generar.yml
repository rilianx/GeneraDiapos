# Genera presentaciones a partir de los papers de papers/ y abre un PR con el resultado.
#
# Flujo con revisión humana del guion (por defecto):
#   1. Subes un paper a papers/  → se genera solo el guion y llega un PR con
#      guiones/<nombre>.json (editable) y guiones/<nombre>.md (vista legible).
#   2. Revisas el guion en el PR, editas el .json si hace falta y fusionas.
#   3. Al fusionar, guiones/<nombre>.json llega a main → se generan las
#      diapositivas desde ese guion y llega un segundo PR con presentaciones/<nombre>/.
#
# Para saltarte la revisión: variable del repo REVISAR_GUION=false, o lánzalo a mano
# desde Actions con modo "completo".
name: generar presentacion

on:
  push:
    branches: [main]
    paths: ["papers/**", "guiones/**"]
  workflow_dispatch:
    inputs:
      paper:
        description: "Ruta del paper (p. ej. papers/lsmear.pdf). Vacío si usas un guion."
        required: false
      modo:
        description: "guion: solo el guion para revisar; completo: todo de una vez"
        type: choice
        options: [guion, completo]
        default: guion
      guion:
        description: "Ruta de un guion ya revisado (p. ej. guiones/lsmear.json)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      LLM_MODEL_OUTLINE: ${{ vars.LLM_MODEL_OUTLINE }}
      LLM_MODEL_SLIDES: ${{ vars.LLM_MODEL_SLIDES }}
      LLM_REASONING_OUTLINE: ${{ vars.LLM_REASONING_OUTLINE }}
      LLM_MODEL_REVIEW: ${{ vars.LLM_MODEL_REVIEW }}
      LLM_REASONING_REVIEW: ${{ vars.LLM_REASONING_REVIEW }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Elegir trabajos
        id: jobs
        env:
          INPUT_PAPER: ${{ github.event.inputs.paper }}
          INPUT_MODO: ${{ github.event.inputs.modo }}
          INPUT_GUION: ${{ github.event.inputs.guion }}
          REVISAR: ${{ vars.REVISAR_GUION || 'true' }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Cada línea: modo|ruta. Modos: guion, completo, desde_guion.
          if [ -n "$INPUT_GUION" ]; then
            jobs="desde_guion|$INPUT_GUION"
          elif [ -n "$INPUT_PAPER" ]; then
            jobs="${INPUT_MODO:-guion}|$INPUT_PAPER"
          else
            modo=$([ "$REVISAR" = "false" ] && echo completo || echo guion)
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              papers=$(git ls-files 'papers/*.pdf' 'papers/*.tex' 'papers/*.md')
              guiones=""
            else
              papers=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- \
                       'papers/*.pdf' 'papers/*.tex' 'papers/*.md')
              guiones=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'guiones/*.json')
            fi
            jobs=$( { for f in $papers; do echo "$modo|$f"; done
                      for f in $guiones; do echo "desde_guion|$f"; done; } )
          fi
          echo "Trabajos:"; echo "$jobs"
          { echo "list<<EOF"; echo "$jobs"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          grep -q '^guion|' <<< "$jobs" && echo "guion=true" >> "$GITHUB_OUTPUT" || true
          grep -qE '^(completo|desde_guion)\|' <<< "$jobs" && echo "slides=true" >> "$GITHUB_OUTPUT" || true

      - uses: actions/setup-python@v5
        if: steps.jobs.outputs.list != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar LaTeX
        if: steps.jobs.outputs.list != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-fonts-recommended

      - name: Instalar dependencias Python
        if: steps.jobs.outputs.list != ''
        run: pip install -r requirements.txt

      - name: Generar
        if: steps.jobs.outputs.list != ''
        env:
          JOBS: ${{ steps.jobs.outputs.list }}
        run: |
          status=0
          while IFS='|' read -r modo f; do
            [ -z "$f" ] && continue
            name=$(basename "${f%.*}")
            echo "::group::$modo $f"
            case "$modo" in
              guion)       python beamer_graph.py "$f" --solo-guion "guiones/$name.json" || status=1 ;;
              completo)    python beamer_graph.py "$f" --out "presentaciones/$name" --concurrency 3 || status=1 ;;
              desde_guion) python beamer_graph.py --guion "$f" --out "presentaciones/$name" --concurrency 3 || status=1 ;;
            esac
            echo "::endgroup::"
          done <<< "$JOBS"
          exit $status

      - name: Subir resultados como artefacto
        if: always() && steps.jobs.outputs.list != ''
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            presentaciones/
            guiones/
          if-no-files-found: ignore

      - name: Abrir PR con los guiones
        if: steps.jobs.outputs.guion == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: guiones/${{ github.run_id }}
          commit-message: "Guiones para revisar (run ${{ github.run_id }})"
          title: "Guion para revisar"
          add-paths: guiones/
          body: |
            Guiones generados a partir de:
            ```
            ${{ steps.jobs.outputs.list }}
            ```
            1. Lee `guiones/<nombre>.md`: orden, tipo de cada diapo y **qué fragmentos usa**
               (`sources`), sobre todo las tablas (`tab*`): la lista de tablas del paper está al inicio.
            2. Si algo está mal, edita `guiones/<nombre>.json` en este PR (título, puntos, `kind`,
               `sources`). El `.md` es solo una vista; no hace falta actualizarlo.
            3. Fusiona el PR: eso genera las diapositivas desde el guion y abre otro PR.

      - name: Abrir PR con las presentaciones
        if: steps.jobs.outputs.slides == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: presentaciones/${{ github.run_id }}
          commit-message: "Presentaciones generadas (run ${{ github.run_id }})"
          title: "Presentaciones generadas"
          add-paths: presentaciones/
          body: |
            Generado automáticamente a partir de:
            ```
            ${{ steps.jobs.outputs.list }}
            ```
            Revisa `informe.md` de cada carpeta: estado por diapositiva, intentos, avisos del
            revisor (afirmaciones no respaldadas), de estilo y cifras a verificar. El PDF
            también está en los artefactos del run.
